name: Photo Sorter Android app

on:
  push:
    paths:
      - "photo-sorter-app/**"
      - ".github/workflows/android-app.yml"
  workflow_dispatch:

permissions:
  contents: write # to publish the APK as a release

jobs:
  verify-clip-models:
    # The app downloads these at runtime, so check they still exist and behave as expected.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install onnxruntime==1.20.1 numpy pillow
      - run: python photo-sorter-app/tools/verify_clip_models.py /tmp/clip

  build:
    needs: verify-clip-models
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: photo-sorter-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle the CLIP models into the APK
        run: sh tools/fetch_clip_models.sh

      - name: Unit tests and APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk PhotoSorter.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-apk
          path: photo-sorter-app/PhotoSorter.apk

      # A fixed release tag gives a stable download link you can open on the phone.
      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete photo-sorter-latest --yes --cleanup-tag || true
          gh release create photo-sorter-latest PhotoSorter.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Photo Sorter (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}. Open this page on your Android phone and tap PhotoSorter.apk to install."
