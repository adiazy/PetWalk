name: Build Mail Triage APK

on:
  push:
    branches: [mailtriage]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: MailTriage-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the mailtriage-apk branch
        run: |
          mkdir -p /tmp/out && cp app/build/outputs/apk/debug/app-debug.apk /tmp/out/MailTriage.apk
          cd /tmp/out
          git init -q -b mailtriage-apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add MailTriage.apk
          git commit -qm "APK from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" mailtriage-apk
